services:
  catalog.db:
    container_name: catalog.db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  basket.db:
    container_name: basket.db
    restart: always
    ports:
      - "6379:6379"
        
  discount.db:
    container_name: discount.db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=Password@123
      - POSTGRES_DB=DiscountDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  ordering.db:
    container_name: ordering.db
    environment:
      - SA_PASSWORD=Password@123
      - ACCEPT_EULA=Y
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL","/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Password@123' -Q 'select 1'"]
      interval: 10s
      timeout: 10s
      retries: 3
      
  identity.db:
    container_name: identity.db
    environment:
      - SA_PASSWORD=Password@123
      - ACCEPT_EULA=Y
    restart: always
    ports:
      - "1434:1433"
    volumes:
      - identitydb_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL","/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Password@123' -Q 'select 1'" ]
      interval: 10s
      timeout: 10s
      retries: 3
  
  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
      
  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseSettings__ConnectionString=mongodb://catalog.db:27017
      - DatabaseSettings__DatabaseName=CatalogDb
      - DatabaseSettings__ProductCollectionName=Products
      - DatabaseSettings__BrandCollectionName=Brands
      - DatabaseSettings__TypeCollectionName=Types
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    depends_on:
      - catalog.db
    ports:
      - "8010:8080"
      - "8011:8081"
        
  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CacheSettings__ConnectionString=basket.db:6379
      - GrpcSettings__DiscountUrl=http://discount.api:8080
      - EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    depends_on:
      - basket.db
      - rabbitmq
    ports:
      - "8020:8080"
      - "8021:8081"
  
  discount.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseSettings__ConnectionString=Server=discount.db;Port=5432;Database=DiscountDb;User Id=admin;Password=Password@123
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    depends_on:
      - discount.db
    ports:
      - "8030:8080"
      - "8031:8081"

  ordering.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseSettings__ConnectionString=Server=ordering.db;Port=1433;Database=OrderingDb;User Id=sa;Password=Password@123
      - EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    depends_on:
      - ordering.db
      - rabbitmq
    ports:
      - "8040:8080"
      - "8041:8081"
        
  payment.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672/
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    ports:
      - "8050:8080"
      - "8051:8081"
  
  identity.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseSettings__ConnectionString=Server=identity.db;Port=1434;Database=IdentityDb;User Id=sa;Password=Password@123
      - Jwt__Key=super_secure_secret_key1234567890-!@#$%^&*()_+
      - Jwt__Issuer=learn-dotnet-ecommerce-microservices
      - Jwt__Audience=learn-dotnet-ecommerce-microservices
      - Jwt_DurationInMinutes=60
      - ElasticConfiguration__Uri=http://elasticsearch:9200
    depends_on:
      - identity.db
    ports:
      - "8060:8080"
      - "8061:8081"

  elasticsearch:
    container_name: elasticsearch
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    container_name: kibana
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"